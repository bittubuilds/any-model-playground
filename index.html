<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Any-Model Playground</title>
<style>
  :root{
    --bg:#0b0c0f; --panel:#12141a; --line:#232733; --fg:#e8eaf0; --dim:#8b93a7;
    --accent:#ff3b30; --ok:#3ddc84; --user:#1b1f29; --bot:#141821;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; overflow:hidden;
  }
  aside{
    width:320px; flex:0 0 320px; background:var(--panel); border-right:1px solid var(--line);
    padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
  }
  h1{font-size:16px; margin:0; letter-spacing:.2px}
  .sub{font-size:12px; color:var(--dim); margin:-6px 0 4px}
  label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:4px}
  .field{display:flex; flex-direction:column}
  select,input,textarea{
    width:100%; background:#0e1016; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font:inherit; font-size:13px; outline:none;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical}
  .row{display:flex; gap:10px}
  .row > .field{flex:1}
  .btns{display:flex; gap:8px; margin-top:2px}
  button{
    font:inherit; font-size:13px; border-radius:8px; padding:9px 12px; cursor:pointer;
    border:1px solid var(--line); background:#171b24; color:var(--fg);
  }
  button:hover{border-color:#39404f}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45; cursor:not-allowed}
  .note{font-size:11px; color:var(--dim); line-height:1.5; margin:0}
  .warn{color:#ffb02e}
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  #chat{flex:1; overflow-y:auto; padding:22px 26px; display:flex; flex-direction:column; gap:14px}
  .empty{color:var(--dim); font-size:13px; margin:auto; text-align:center; max-width:340px}
  .msg{max-width:min(760px,92%); padding:11px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word}
  .msg.user{align-self:flex-end; background:var(--user); border:1px solid var(--line)}
  .msg.assistant{align-self:flex-start; background:var(--bot); border:1px solid #1d2230}
  .who{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:5px}
  details.think{margin:0 0 8px; font-size:12px; color:var(--dim)}
  details.think summary{cursor:pointer; color:var(--dim); outline:none; user-select:none}
  details.think .think-body{margin-top:6px; padding-left:10px; border-left:2px solid var(--line); white-space:pre-wrap}
  form{display:flex; gap:10px; padding:14px 26px; border-top:1px solid var(--line); background:#0d0f14}
  #input{flex:1; min-height:46px; max-height:180px; resize:none}
  #status{font-size:12px; padding:0 26px 12px; color:var(--dim); min-height:18px}
  #status.err{color:var(--accent)}
  @media (max-width:820px){
    body{flex-direction:column; overflow:auto}
    aside{width:100%; flex:0 0 auto; border-right:none; border-bottom:1px solid var(--line); max-height:none}
    main{min-height:60vh}
  }
</style>
</head>
<body>
<aside>
  <h1>Any-Model Playground</h1>
  <p class="sub">Apni key, koi bhi model. No login, no server, no app-level filter.</p>

  <div class="field">
    <label for="provider">Provider</label>
    <select id="provider"></select>
  </div>
  <div class="field">
    <label for="model">Model id</label>
    <input id="model" list="modelList" placeholder="model id" autocomplete="off">
    <datalist id="modelList"></datalist>
  </div>
  <div class="field">
    <label for="key">API key</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="base">Base URL</label>
    <input id="base" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="system">System prompt</label>
    <textarea id="system" rows="4" placeholder="Optional. Khali chhodo to kuch bhi inject nahi hoga."></textarea>
  </div>
  <div class="row">
    <div class="field">
      <label for="temp">Temperature</label>
      <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7">
    </div>
    <div class="field">
      <label for="maxtok">Max tokens</label>
      <input id="maxtok" type="number" min="16" step="16" value="2048">
    </div>
  </div>
  <div class="btns">
    <button id="saveState" class="primary">Save settings</button>
    <button id="clearChat">Clear chat</button>
    <button id="detect" type="button">Detect models</button>
  </div>
  <p class="note" id="providerNote"></p>
  <p class="note">Key sirf is browser ke localStorage me rehti hai. Koi server, koi account, koi telemetry nahi.</p>
</aside>

<main>
  <div id="chat"></div>
  <form id="composer">
    <textarea id="input" placeholder="Message... (Enter = send, Shift+Enter = newline)"></textarea>
    <button type="submit" id="send" class="primary">Send</button>
    <button type="button" id="stop" hidden>Stop</button>
  </form>
  <div id="status"></div>
</main>

<script>
const PROVIDERS = {
  ollama: {label:'Ollama (local, uncensored)', base:'http://localhost:11434/v1', kind:'openai', cors:true, needsKey:false,
    models:[
      'eriktonon/qwen3.8-uncensored:9b',
      'eriktonon/qwen3.8-uncensored:27b',
      's1gnature/gemma4-uncensored-mtp:e4b-q4_k_m',
      's1gnature/gemma4-uncensored-mtp:e2b-q4_k_m',
      'mgraffam/qwen3.8-EfficientThink-uncensored:27b',
      'abliterant/qwen3.8-rana:q4_K_M',
      'abliterant/qwen3.8-rana:q3_K_M',
      'dolphin-mistral:latest',
      'dolphin-mixtral:8x7b',
      'llama2-uncensored:7b'
    ]},
  groq: {label:'Groq', base:'https://api.groq.com/openai/v1', kind:'openai', cors:true,
    models:['openai/gpt-oss-120b','llama-3.3-70b-versatile','qwen/qwen3-32b','moonshotai/kimi-k2-instruct']},
  openrouter: {label:'OpenRouter', base:'https://openrouter.ai/api/v1', kind:'openai', cors:true,
    models:['nvidia/nemotron-3-ultra-550b-a55b:free','deepseek/deepseek-chat','meta-llama/llama-3.3-70b-instruct','google/gemma-3-27b-it']},
  anthropic: {label:'Anthropic (Claude)', base:'https://api.anthropic.com/v1', kind:'anthropic', cors:true,
    models:['claude-sonnet-4-5','claude-opus-4-1','claude-3-5-haiku-latest']},
  gemini: {label:'Google Gemini', base:'https://generativelanguage.googleapis.com/v1beta', kind:'gemini', cors:true,
    models:['gemini-2.5-pro','gemini-2.5-flash','gemini-2.0-flash']},
  together: {label:'Together', base:'https://api.together.xyz/v1', kind:'openai', cors:true,
    models:['meta-llama/Llama-3.3-70B-Instruct-Turbo']},
  openai: {label:'OpenAI', base:'https://api.openai.com/v1', kind:'openai', cors:false,
    models:['gpt-4o','gpt-4o-mini','gpt-4.1-mini']},
  mistral: {label:'Mistral', base:'https://api.mistral.ai/v1', kind:'openai', cors:false,
    models:['mistral-large-latest','mistral-small-latest']},
  deepseek: {label:'DeepSeek', base:'https://api.deepseek.com/v1', kind:'openai', cors:false,
    models:['deepseek-chat','deepseek-reasoner']},
  xai: {label:'xAI (Grok)', base:'https://api.x.ai/v1', kind:'openai', cors:false,
    models:['grok-4','grok-3-mini']},
  custom: {label:'Custom / self-hosted (OpenAI-compatible)', base:'http://localhost:11434/v1', kind:'openai', cors:true, needsKey:false,
    models:['llama3.1','qwen2.5','mistral']}
};

const $ = s => document.querySelector(s);
const providerSel = $('#provider'), modelInput = $('#model'), keyInput = $('#key'),
      baseInput = $('#base'), systemInput = $('#system'), tempInput = $('#temp'),
      maxtokInput = $('#maxtok'), chatEl = $('#chat'), inputEl = $('#input'),
      statusEl = $('#status'), sendBtn = $('#send'), stopBtn = $('#stop'),
      noteEl = $('#providerNote');

const STORE = 'amp.settings.v1';
let messages = [];
let controller = null;
let liveEl = null;
let liveThinkEl = null;
let liveThink = null;

function readStore(){
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; }
}
function writeStore(o){ try { localStorage.setItem(STORE, JSON.stringify(o)); } catch(e){} }

function initProviders(){
  providerSel.innerHTML = Object.keys(PROVIDERS)
    .map(k => '<option value="'+k+'">'+PROVIDERS[k].label+'</option>').join('');
  const saved = readStore();
  providerSel.value = saved.provider && PROVIDERS[saved.provider] ? saved.provider : 'ollama';
  applyProvider(providerSel.value);
}

function applyProvider(name){
  const p = PROVIDERS[name];
  const saved = (readStore().byProvider || {})[name] || {};
  baseInput.value = saved.base || p.base;
  modelInput.value = saved.model || (p.models && p.models[0]) || '';
  keyInput.value = saved.key || '';
  systemInput.value = saved.system || '';
  tempInput.value = saved.temp != null ? saved.temp : 0.7;
  maxtokInput.value = saved.maxTokens || 2048;
  $('#modelList').innerHTML = (p.models || []).map(m => '<option value="'+m+'">').join('');
  updateNote();
  render();
}

function humanError(e){
  const msg = String(e && e.message ? e.message : e);
  const localBase = /localhost|127\.0\.0\.1/.test(baseInput.value);
  if(msg === 'Failed to fetch' && localBase && location.protocol === 'https:'){
    return 'Ye page HTTPS pe hai aur browser HTTPS se http://localhost block karta hai. Ollama ke liye page local se kholo: python3 -m http.server 8000, phir http://localhost:8000/index.html';
  }
  if(msg === 'Failed to fetch'){
    return localBase
      ? 'localhost se connect nahi hua. Ollama chalu hai? Terminal me: ollama serve. CORS ke liye OLLAMA_ORIGINS=* set karo.'
      : 'Request block hui (CORS ya network). Us provider ke liye proxy.mjs chalao.';
  }
  return msg;
}

function updateNote(){
  const name = providerSel.value;
  const p = PROVIDERS[name];
  const model = modelInput.value.trim() || (p.models && p.models[0]) || '<model>';
  let text, warn = !p.cors;

  if(name === 'ollama'){
    const remote = !/localhost|127\.0\.0\.1/.test(baseInput.value);
    text = (remote ? 'Remote Ollama (Codespaces/cloud). Model pehle pull hona chahiye: ollama pull ' + model
                   : 'Local model. Pehle chalao: ollama pull ' + model) +
      '  |  CORS error aaye to OLLAMA_ORIGINS=* set karo. Lambi chat ke liye OLLAMA_CONTEXT_LENGTH=32768 set karo.';
  } else {
    text = p.cors
      ? 'Ye provider browser se direct chalta hai.'
      : 'Is provider ka browser CORS open nahi hai. proxy.mjs chalao aur Base URL me http://localhost:8787' + p.base + ' daalo.';
  }

  if(location.protocol === 'https:' && /localhost|127\.0\.0\.1/.test(baseInput.value)){
    warn = true;
    text += ' | Ye page HTTPS pe hai, browser localhost block karega. Local model ke liye page local se kholo.';
  }
  noteEl.className = 'note' + (warn ? ' warn' : '');
  noteEl.textContent = text;
}

async function detectOllama(){
  const base = (baseInput.value.trim() || PROVIDERS.ollama.base).replace(/\/+$/, '');
  const root = base.replace(/\/v1$/, '');
  setStatus('Local models dhoond raha hoon...', false);
  try {
    const r = await fetch(root + '/api/tags');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const names = (j.models || []).map(m => m.name || m.model).filter(Boolean);
    const uniq = Array.from(new Set(names));
    $('#modelList').innerHTML = uniq.map(n => '<option value="' + n + '">').join('');
    if(uniq.length){
      setStatus(uniq.length + ' local model mile: ' + uniq.slice(0, 4).join(', ') + (uniq.length > 4 ? ' ...' : ''), false);
    } else {
      setStatus('Ollama chal raha hai par koi model pull nahi hua. ollama pull ' + modelInput.value, true);
    }
  } catch(e){
    setStatus(humanError(e), true);
  }
}

function saveSettings(){
  const name = providerSel.value;
  const s = readStore();
  s.provider = name;
  s.byProvider = s.byProvider || {};
  s.byProvider[name] = {
    base: baseInput.value.trim(),
    model: modelInput.value.trim(),
    key: keyInput.value.trim(),
    system: systemInput.value,
    temp: parseFloat(tempInput.value),
    maxTokens: parseInt(maxtokInput.value, 10)
  };
  writeStore(s);
  setStatus('Settings saved (browser me).', false);
}

function setStatus(t, isErr){
  statusEl.textContent = t || '';
  statusEl.className = isErr ? 'err' : '';
}

function bubble(m){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = m.role === 'user' ? 'You' : 'Assistant';
  d.appendChild(who);
  if(m.role !== 'user'){
    const det = document.createElement('details');
    det.className = 'think';
    if(!m.think) det.hidden = true;
    const sum = document.createElement('summary');
    sum.textContent = 'Thinking';
    const tb = document.createElement('div');
    tb.className = 'think-body';
    tb.textContent = m.think || '';
    det.appendChild(sum); det.appendChild(tb);
    d.appendChild(det);
  }
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = m.content;
  d.appendChild(body);
  return d;
}

function render(){
  chatEl.innerHTML = '';
  liveEl = null;
  if(!messages.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Provider select karo, apni API key daalo, phir kuch bhi poocho.';
    chatEl.appendChild(e);
    return;
  }
  for(const m of messages) chatEl.appendChild(bubble(m));
  const last = chatEl.lastElementChild;
  liveEl = last ? last.querySelector('.body') : null;
  liveThinkEl = last ? last.querySelector('details.think') : null;
  liveThink = last ? last.querySelector('.think-body') : null;
  scroll();
}

function scroll(){ chatEl.scrollTop = chatEl.scrollHeight; }

function updateLive(a){
  if(liveThink){
    liveThink.textContent = a.think || '';
    if(liveThinkEl) liveThinkEl.hidden = !a.think;
  }
  if(liveEl) liveEl.textContent = a.content;
  scroll();
}

function setBusy(b){
  sendBtn.disabled = b;
  stopBtn.hidden = !b;
  inputEl.disabled = false;
}

function currentCfg(){
  const name = providerSel.value;
  const p = PROVIDERS[name];
  return {
    name, kind: p.kind, needsKey: p.needsKey !== false,
    base: (baseInput.value.trim() || p.base).replace(/\/+$/, ''),
    key: keyInput.value.trim(),
    model: modelInput.value.trim(),
    system: systemInput.value.trim(),
    temp: isNaN(parseFloat(tempInput.value)) ? 0.7 : parseFloat(tempInput.value),
    maxTokens: parseInt(maxtokInput.value, 10) || 1024,
    signal: controller ? controller.signal : undefined
  };
}

async function errText(res){
  let t = '';
  try { t = await res.text(); } catch(e){}
  let msg = t;
  try {
    const j = JSON.parse(t);
    msg = (j.error && (j.error.message || j.error.type)) || j.message || t;
  } catch(e){}
  return 'HTTP ' + res.status + ': ' + String(msg).slice(0, 600);
}

function sseReader(res, onEvent){
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  return (async () => {
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while((idx = buf.indexOf('\n')) >= 0){
        const raw = buf.slice(0, idx).replace(/\r$/, '');
        buf = buf.slice(idx + 1);
        if(!raw.startsWith('data:')) continue;
        const data = raw.slice(5).trim();
        if(!data || data === '[DONE]') continue;
        let j;
        try { j = JSON.parse(data); } catch(e){ continue; }
        onEvent(j);
      }
    }
  })();
}

async function streamOpenAI(c, msgs, onDelta, onThink){
  const headers = {'Content-Type':'application/json'};
  if(c.key) headers['Authorization'] = 'Bearer ' + c.key;
  if(c.name === 'openrouter'){ headers['HTTP-Referer'] = location.href; headers['X-Title'] = 'Any-Model Playground'; }
  const payload = (c.system ? [{role:'system', content:c.system}] : []).concat(msgs);
  const body = {model:c.model, messages:payload, stream:true, max_tokens:c.maxTokens};
  if(c.name !== 'openai') body.temperature = c.temp;
  const res = await fetch(c.base + '/chat/completions', {
    method:'POST', headers, body: JSON.stringify(body), signal:c.signal
  });
  if(!res.ok) throw new Error(await errText(res));
  await sseReader(res, j => {
    const ch = j.choices && j.choices[0];
    if(!ch || !ch.delta) return;
    const cont = ch.delta.content;
    if(typeof cont === 'string' && cont) onDelta(cont);
    const think = ch.delta.reasoning || ch.delta.reasoning_content;
    if(typeof think === 'string' && think) onThink(think);
  });
}

async function streamAnthropic(c, msgs, onDelta, onThink){
  const body = {
    model: c.model,
    max_tokens: c.maxTokens,
    temperature: c.temp,
    stream: true,
    messages: msgs.map(m => ({role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content}))
  };
  if(c.system) body.system = c.system;
  const res = await fetch(c.base + '/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': c.key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body),
    signal: c.signal
  });
  if(!res.ok) throw new Error(await errText(res));
  await sseReader(res, j => {
    if(j.type === 'content_block_delta' && j.delta){
      if(j.delta.type === 'thinking_delta' && typeof j.delta.thinking === 'string') onThink(j.delta.thinking);
      else if(typeof j.delta.text === 'string' && j.delta.text) onDelta(j.delta.text);
    }
    if(j.type === 'error' && j.error) throw new Error(j.error.message || 'stream error');
  });
}

async function streamGemini(c, msgs, onDelta, onThink){
  const url = c.base + '/models/' + encodeURIComponent(c.model) + ':streamGenerateContent?alt=sse';
  const body = {
    contents: msgs.map(m => ({role: m.role === 'assistant' ? 'model' : 'user', parts:[{text: m.content}]})),
    generationConfig: {temperature: c.temp, maxOutputTokens: c.maxTokens}
  };
  if(c.system) body.systemInstruction = {parts:[{text: c.system}]};
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json', 'x-goog-api-key': c.key},
    body: JSON.stringify(body),
    signal: c.signal
  });
  if(!res.ok) throw new Error(await errText(res));
  await sseReader(res, j => {
    const cand = j.candidates && j.candidates[0];
    if(!cand || !cand.content || !cand.content.parts) return;
    for(const part of cand.content.parts){
      if(typeof part.text !== 'string' || !part.text) continue;
      if(part.thought) onThink(part.text); else onDelta(part.text);
    }
  });
}

async function run(){
  const text = inputEl.value.trim();
  if(!text) return;
  const c = currentCfg();
  if(c.needsKey !== false && !c.key){ setStatus('API key daalo pehle.', true); return; }
  if(!c.model){ setStatus('Model id daalo.', true); return; }

  controller = new AbortController();
  setBusy(true);
  setStatus('');

  messages.push({role:'user', content:text});
  const a = {role:'assistant', content:''};
  messages.push(a);
  inputEl.value = '';
  render();

  const onDelta = t => { a.content += t; updateLive(a); };
  const onThink = t => { a.think = (a.think || '') + t; updateLive(a); };
  const history = messages.slice(0, -1).map(m => ({role:m.role, content:m.content}));

  try {
    if(c.kind === 'anthropic') await streamAnthropic(c, history, onDelta, onThink);
    else if(c.kind === 'gemini') await streamGemini(c, history, onDelta, onThink);
    else await streamOpenAI(c, history, onDelta, onThink);
    if(!a.content && a.think) a.content = '(thinking me hi token khatam ho gaye, max tokens badhao)';
    else if(!a.content) a.content = '(empty response)';
  } catch(e){
    if(e.name === 'AbortError'){
      a.content += (a.content ? '\n\n' : '') + '[stopped]';
    } else {
      setStatus(humanError(e), true);
      if(!a.content) a.content = '(request failed)';
    }
  } finally {
    controller = null;
    setBusy(false);
    render();
  }
}

providerSel.addEventListener('change', () => applyProvider(providerSel.value));
modelInput.addEventListener('input', updateNote);
$('#detect').addEventListener('click', detectOllama);
$('#saveState').addEventListener('click', saveSettings);
$('#clearChat').addEventListener('click', () => { messages = []; inputEl.value = ''; setStatus(''); render(); });
stopBtn.addEventListener('click', () => { if(controller) controller.abort(); });

$('#composer').addEventListener('submit', e => { e.preventDefault(); run(); });
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); run(); }
});

initProviders();
</script>
</body>
</html>
